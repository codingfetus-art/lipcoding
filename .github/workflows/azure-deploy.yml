name: Build and Deploy to Azure Web App

on:
  push:
    branches:
      - jinu

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Install server deps
        run: |
          cd server
          npm ci
      - name: Install client deps and build
        run: |
          cd client
          npm ci
          npm run build
      - name: Test server
        run: |
          cd server
          npm test
      - name: Copy client build to server
        run: |
          mkdir -p server/public
          cp -r client/dist/* server/public/
      - name: Prepare Azure deploy package
        run: |
          mkdir -p deploy-package
          cp server/package.json server/package-lock.json server/index.js deploy-package/
          cp -r server/src server/public deploy-package/
          if [ -d server/data ]; then cp -r server/data deploy-package/; fi
          if [ -f server/.env.example ]; then cp server/.env.example deploy-package/.env.example; fi
      - name: Deploy to Azure Web App
        if: ${{ vars.ENABLE_AZURE_ACTION_DEPLOY == 'true' }}
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy-package
